send_anonymous_usage_stats: true
project_id: "tap-concur"
default_environment: test
requires_meltano: ">=4.0"
environments:
- name: test
plugins:
  extractors:
  - name: "tap-concur"
    namespace: "tap_concur"
    pip_url: -e .
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    - structured-logging

    settings:
    - name: client_id
      label: Client ID
      description: OAuth client ID from SAP Concur App Management
    - name: client_secret
      label: Client Secret
      description: OAuth client secret
      sensitive: true
    - name: refresh_token
      label: Refresh Token
      description: OAuth refresh token (rotated on each refresh)
      sensitive: true
    - name: username
      label: Username
      description: Company UUID for initial authtoken grant
    - name: password
      label: Auth Token
      description: Auth token (at-...) for initial authtoken grant
      sensitive: true
    - name: api_url
      label: API URL
      description: API base URL (from token geolocation after auth)
    - name: start_date
      kind: date_iso8601
      label: Start Date
      description: Earliest invoice LastModifiedDate to sync

    settings_group_validation:
    - [client_id, client_secret]

    config:
      start_date: "2020-01-01T00:00:00Z"
      api_url: https://us.api.concursolutions.com
      credtype: authtoken

  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl
